{% extends "base.html" %}

{% block main_content %}

<section id="add_carer">

    <form action="" method="POST" novalidate>

        {{ form.hidden_tag() }}

        {{ form.username.label }}
        {{ form.username() }}

        {% for error in form.username.errors %}
            {{ error }}
        {% endfor %}

        <br />

        {{ form.submit() }}

    </form>
    <p>{{ response }}</p>


</section>

{% endblock %}
