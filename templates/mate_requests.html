{% extends "base.html" %}

{% block main_content %}

<h1>Mate Requests</h1>

<table>
    {% for invite in invites %}
        <tr>
            <td>{{ invite["receiver"] }}</td>
            <td>
                <a href="{{ url_for('accept_request', friend1=invite['sender'])}}">
                    Accept Request
                </a>
                <a href="{{ url_for('reject_request', sender=invite['sender'])}}">
                    Reject Request
                </a>
            </td>
        </tr>
    {% endfor %}
</table>


{% endblock %}
