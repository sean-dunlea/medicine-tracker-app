{% extends "base.html" %}

{% block main_content %}

<main class="calendar-container">

    <header class="calendar-header">
        <a href="{{ url_for('month_calendar', year=prev_year, month=prev_month) }}" 
           class="arrow" 
           aria-label="Previous month">
           &#8249;
        </a>

        <h2>{{ month_name }} {{ year }}</h2>

        <a href="{{ url_for('month_calendar', year=next_year, month=next_month) }}" 
           class="arrow" 
           aria-label="Next month">
           &#8250;
        </a>
    </header>

    <section class="weekdays" aria-label="Weekday headings">
        <span>S</span>
        <span>M</span>
        <span>T</span>
        <span>W</span>
        <span>T</span>
        <span>F</span>
        <span>S</span>
    </section>

    <section class="calendar-grid" aria-label="Calendar days">
        {% for day in calendar %}
            <article class="calendar-day
                {{ day.status }}
                {% if not day.in_month %}faded{% endif %}
                {% if day.date == today %}today{% endif %}">
                <time datetime="{{ day.date }}">
                    {{ day.date.day }}
                </time>
            </article>
        {% endfor %}
    </section>

</main>

{% endblock %}
